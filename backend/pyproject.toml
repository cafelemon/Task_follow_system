[project]
name = "task-follow-system-backend"
version = "4.2.0"
description = "Company task follow system backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
